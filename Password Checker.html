<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Checker</title>

<style>
  :root {
    --bg: #060807;
    --surface: #0c120d;
    --surface2: #121a13;
    --border: #1e2b20;
    --text: #dcffe9;
    --muted: #6f8a76;
    --accent: #00ff9d;
    --accent2: #00c2ff;
    --good: #00ff9d;
    --bad: #ff4d6d;
    --warn: #ffd34d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(0, 255, 157, .10), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, rgba(0, 194, 255, .08), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
  }

  .card {
    width: min(460px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 26px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }

  header { text-align: center; margin-bottom: 22px; }
  header .logo { font-size: 2.4rem; }
  header h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -.5px;
    margin-top: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---------- input ---------- */
  .input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    transition: border-color .12s ease;
  }
  .input-wrap:focus-within { border-color: var(--accent); }

  .input-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 1.05rem;
    padding: 12px 12px;
    outline: none;
    font-family: "Consolas", "Courier New", monospace;
    letter-spacing: .5px;
    min-width: 0;
  }
  .input-wrap input::placeholder { color: var(--muted); font-family: "Segoe UI", sans-serif; letter-spacing: 0; }

  .ibtn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.15rem;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 10px;
    transition: color .12s ease, background .12s ease;
    flex-shrink: 0;
  }
  .ibtn:hover { color: var(--accent); background: rgba(0, 255, 157, .08); }

  /* ---------- meter ---------- */
  #meter {
    display: flex;
    gap: 5px;
    margin: 18px 0 8px;
  }
  .seg {
    flex: 1;
    height: 8px;
    border-radius: 99px;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: background .25s ease, box-shadow .25s ease;
  }
  #label {
    text-align: right;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .04em;
    margin-bottom: 6px;
    color: var(--muted);
    min-height: 1.2em;
  }

  /* ---------- crack time ---------- */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 14px 0 18px;
  }
  .stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .stat .v { font-size: 1.05rem; font-weight: 800; word-break: break-word; }
  .stat .l { color: var(--muted); font-size: .72rem; margin-top: 3px; }

  /* ---------- checklist ---------- */
  .checks { list-style: none; margin-bottom: 18px; }
  .checks li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: .88rem;
    color: var(--muted);
    padding: 6px 4px;
    transition: color .15s ease;
  }
  .checks li .box {
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: .7rem;
    color: transparent;
    flex-shrink: 0;
    transition: all .15s ease;
  }
  .checks li.ok { color: var(--text); }
  .checks li.ok .box {
    background: rgba(0, 255, 157, .15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---------- buttons ---------- */
  .row { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    border-radius: 13px;
    padding: 13px 16px;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:hover { filter: brightness(1.08); }
  .btn-primary {
    background: linear-gradient(90deg, #00b36b, #00ff9d);
    color: #04120c;
    box-shadow: 0 8px 22px rgba(0, 255, 157, .25);
  }
  .btn-ghost {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  footer { text-align: center; color: var(--muted); font-size: .72rem; margin-top: 16px; }
</style>
</head>
<body>

<div class="card">
  <header>
    <div class="logo">🔐</div>
    <h1>Password Checker</h1>
  </header>

  <div class="input-wrap">
    <input id="pw" type="password" placeholder="Type a password…" autocomplete="off" spellcheck="false" />
    <button class="ibtn" id="eye" title="Show">👁️</button>
    <button class="ibtn" id="copy" title="Copy">📋</button>
  </div>

  <div id="meter">
    <div class="seg"></div><div class="seg"></div><div class="seg"></div>
    <div class="seg"></div><div class="seg"></div>
  </div>
  <div id="label">—</div>

  <div class="stats">
    <div class="stat"><div class="v" id="crackTime">—</div><div class="l">Time to crack</div></div>
    <div class="stat"><div class="v" id="entropy">—</div><div class="l">Entropy</div></div>
  </div>

  <ul class="checks">
    <li id="c_len"><span class="box">✓</span>At least 12 characters</li>
    <li id="c_upper"><span class="box">✓</span>Uppercase letter</li>
    <li id="c_lower"><span class="box">✓</span>Lowercase letter</li>
    <li id="c_digit"><span class="box">✓</span>Number</li>
    <li id="c_symbol"><span class="box">✓</span>Symbol</li>
    <li id="c_common"><span class="box">✓</span>Not a common password</li>
  </ul>

  <div class="row">
    <button class="btn btn-primary" id="gen">⚡ Generate</button>
    <button class="btn btn-ghost" id="clear">✕ Clear</button>
  </div>

  <footer>Nothing is sent anywhere — all checks run on this page.</footer>
</div>

<script>
/* common passwords */
const COMMON = [
  "password", "123456", "12345678", "123456789", "qwerty", "abc123",
  "password1", "iloveyou", "admin", "welcome", "letmein", "monkey",
  "dragon", "football", "baseball", "sunshine", "princess", "shadow",
  "master", "111111", "123123", "654321", "000000", "superman",
  "batman", "trustno1", "freedom", "whatever", "qwerty123", "1q2w3e4r",
  "password123", "p@ssw0rd", "changeme", "secret", "login", "starwars"
];

const CHARS = {
  lower: "abcdefghijklmnopqrstuvwxyz",
  upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
  digit: "0123456789",
  symbol: "!@#$%^&*()-_=+[]{};:,.<>?/~"
};

const LEVELS = [
  { name: "Very weak", color: "#ff4d6d", segs: 1 },
  { name: "Weak",       color: "#ff8a4d", segs: 2 },
  { name: "Fair",       color: "#ffd34d", segs: 3 },
  { name: "Strong",     color: "#7dff4d", segs: 4 },
  { name: "Very strong", color: "#00ff9d", segs: 5 }
];

function analyze(pw) {
  const has = {
    lower: /[a-z]/.test(pw),
    upper: /[A-Z]/.test(pw),
    digit: /[0-9]/.test(pw),
    symbol: /[^A-Za-z0-9]/.test(pw)
  };

  let pool = 0;
  if (has.lower) pool += 26;
  if (has.upper) pool += 26;
  if (has.digit) pool += 10;
  if (has.symbol) pool += 33;
  if (pool === 0) pool = 1;

  const entropy = pw.length * Math.log2(pool);
  const common = COMMON.includes(pw.toLowerCase());

  let level;
  if (!pw) level = 0;
  else if (common || entropy < 28) level = 0;
  else if (entropy < 36) level = 1;
  else if (entropy < 60) level = 2;
  else if (entropy < 90) level = 3;
  else level = 4;

  return { has, entropy, common, level };
}

function crackTime(entropy) {
  const guesses = Math.pow(2, entropy) / 2;        // avg guesses
  const perSec = 10e9;                             // 10 billion/sec (GPU)
  let secs = guesses / perSec;
  if (secs < 1) return "instantly";
  const units = [
    [31536000, "years"], [86400, "days"], [3600, "hours"], [60, "minutes"], [1, "seconds"]
  ];
  for (const [div, name] of units) {
    if (secs >= div) {
      const v = Math.round(secs / div);
      if (name === "years" && v > 1000) return "centuries";
      if (name === "years" && v >= 1000000) return "forever";
      return v + " " + name;
    }
  }
  return "instantly";
}

function render() {
  const pw = document.getElementById("pw").value;
  const { has, entropy, common, level } = analyze(pw);

  // meter
  const segs = document.querySelectorAll("#meter .seg");
  const L = LEVELS[level];
  segs.forEach((s, i) => {
    const on = pw && i < L.segs;
    s.style.background = on ? L.color : "";
    s.style.borderColor = on ? L.color : "";
    s.style.boxShadow = on ? "0 0 8px " + L.color + "66" : "";
  });

  const label = document.getElementById("label");
  label.textContent = pw ? L.name : "—";
  label.style.color = pw ? L.color : "var(--muted)";

  // stats
  document.getElementById("crackTime").textContent = pw ? crackTime(entropy) : "—";
  document.getElementById("entropy").textContent = pw ? Math.round(entropy) + " bits" : "—";

  // checklist
  const reqs = [
    ["c_len", pw.length >= 12],
    ["c_upper", has.upper],
    ["c_lower", has.lower],
    ["c_digit", has.digit],
    ["c_symbol", has.symbol],
    ["c_common", pw.length > 0 && !common]
  ];
  for (const [id, ok] of reqs) {
    document.getElementById(id).classList.toggle("ok", ok);
  }
}

/* ---------- generate ---------- */
function generate() {
  const lower = CHARS.lower, upper = CHARS.upper, digit = CHARS.digit, symbol = CHARS.symbol;
  const all = lower + upper + digit + symbol;

  const crypto = window.crypto || window.msCrypto;
  const pick = (set) => set[Math.floor(Math.random() * set.length)];
  const rand = crypto ? (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n
                      : (n) => Math.floor(Math.random() * n);

  const pickCrypto = (set) => set[rand(set.length)];

  // guarantee one of each, then fill to 16
  let pw = [pickCrypto(lower), pickCrypto(upper), pickCrypto(digit), pickCrypto(symbol)];
  while (pw.length < 16) pw.push(pickCrypto(all));
  // shuffle
  for (let i = pw.length - 1; i > 0; i--) {
    const j = rand(i + 1);
    [pw[i], pw[j]] = [pw[j], pw[i]];
  }
  return pw.join("");
}

/* ---------- events ---------- */
const input = document.getElementById("pw");
input.addEventListener("input", render);

document.getElementById("eye").addEventListener("click", () => {
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  document.getElementById("eye").textContent = show ? "🙈" : "👁️";
});

document.getElementById("copy").addEventListener("click", async () => {
  if (!input.value) return;
  try {
    await navigator.clipboard.writeText(input.value);
    const b = document.getElementById("copy");
    b.textContent = "✅";
    setTimeout(() => { b.textContent = "📋"; }, 1200);
  } catch (e) {}
});

document.getElementById("gen").addEventListener("click", () => {
  input.value = generate();
  input.type = "text";
  document.getElementById("eye").textContent = "🙈";
  render();
  setTimeout(() => {
    input.type = "password";
    document.getElementById("eye").textContent = "👁️";
  }, 1500);
});

document.getElementById("clear").addEventListener("click", () => {
  input.value = "";
  input.type = "password";
  document.getElementById("eye").textContent = "👁️";
  render();
});

render();
</script>
</body>
</html>
